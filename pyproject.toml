[project]
name = "ddya-detector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juanesgl", email = "juan.sgarcia@mail.escuelaing.edu.co" }
]
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.7",
    "python-levenshtein>=0.27.5",
    "pyvis>=0.3.2",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.scripts]
ddya-detector = "ddya_detector.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
